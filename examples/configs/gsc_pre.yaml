dataset:
  seed: 42
  alphabet:
    size: 4
    eos: "#"
  trial_length:
    min: 1
    max: 20
  splits:
    train: 100
    test: 100

symseq:
  generator:
    type: "ArtificialGrammar"
    mode: "random"
    params:
      label: "Constrained Random Grammar"
      ambiguities: 2
      ambiguity_depth: 2
      n_start_states: 1
      transition_density: 0.25
      assume_equiprobable: true
  tasks:
    - {name: "next_token", type: "NStepPrediction", params: {n: 1}}

seqbench:
  mode: "file"
  prob_generator_type: "restricted"
  # Global grid resolution in seconds (single source of truth for stimulus + gap).
  dt: 0.1
  storage:
    path: "data/SeqBench"
    force_rebuild: false
  composition:
    combine_sequences: true
    sample_length: 20
    gap_profile:
      start: 0
      duration: {dist: "uniform", params: {low: 5, high: 5}}  # seconds
  input_mapping:
    base: "gsc"
    base_params:
      bin_size: 10
      base_dataset_path: "datasets/GSC"
    transforms: []
  task:
    source: "symseq"
    name: "next_token"
