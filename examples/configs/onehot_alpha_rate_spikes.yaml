################################################################################
###                                 SymSeq                                   ###
################################################################################
symseq:
  ################################################################################
  # Generator
  ################################################################################
  generator:
    type: "ArtificialGrammar"
    mode: "random"  # "preset" | "random" | "custom"
    seed: 42
    constraints:
      label: "Constrained Random Grammar"
      alphabet_size: 10
      ambiguities: 0
      ambiguity_depth: 0
      n_start_states: 1
      transition_density: 0.25
      assume_equiprobable: true
      min_string_length: 1
      eos: "#"



################################################################################
###                                 SeqBench                                 ###
################################################################################
seqbench:
    
    seed: 42
    mode: "file"  # "offline", "online" or "file"

    prob_generator_type: "restricted"

    data_generation:
        train_size: 100
        test_size: 100
        seq_len_min: 1
        seq_len_max: 20
        combine_sequences: True  # concatenate sequences
        combined_seq_length: 20  # padding
        regenerate: False
        output_dir: 'data/SeqBench'

    input_mapping:
        base: "one_hot"  # 
        
        transforms:
          ExpandDim:
            axis: 1  # TODO how can the user keep track of this?
            target_size: 700
          # this yields a temporal dimension of nb_steps = duration/dt = 100
          TemporalConvolution:
            kernel_spec:
              shape: "alpha"
              params:
                tau: 20.0
                width: 100.
            dt: 1.
            duration: 100.0
            amp: 10.0

          RateCoding:
            max_rate: 100.0
            normalize: True

          PoissonEncoding:
            # TemporalConvolution from previous step adds a temporal dimension
            temporal: True  
            frame_dt: 0.001  # in seconds
            spike_dt: 0.001  # in seconds

