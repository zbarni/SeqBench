dataset:
  seed: 42
  alphabet:
    size: 10
    eos: "#"
  trial_length:
    min: 1
    max: 20
  splits:
    train: 100
    test: 100

symseq:
  generator:
    type: "ArtificialGrammar"
    mode: "random"
    params:
      label: "Constrained Random Grammar"
      ambiguities: 0
      ambiguity_depth: 0
      n_start_states: 1
      transition_density: 0.25
      assume_equiprobable: true
  tasks:
    - {name: "next_token", type: "NStepPrediction", params: {n: 1}}

seqbench:
  mode: "file"
  prob_generator_type: "restricted"
  time_grid:
    dt: 0.001  # seconds per final output row
  storage:
    path: "data/SeqBench"
    force_rebuild: true
  composition:
    combine_sequences: true
    sample_length: 20
  input_mapping:
    base: "one_hot"
    base_params: {}
    transforms:
      - name: ExpandDim
        axis: 1
        target_size: 700
      - name: TemporalUnfold
        kernel_spec:
          shape: "alpha"
          params:
            tau: 0.010    # seconds
            width: 0.100  # seconds
        out_dt: 0.001     # seconds per unfolded row
        duration: 0.100   # seconds total
        amplitude: 100.0
      - name: RateCoding
        max_rate: 200.0
        normalize: true
      - name: PoissonEncoding
        temporal: true
        # normalize defaults to false: consume RateCoding output as Hz.
        spike_dt: 0.001   # seconds per spike-bin row
  task:
    source: "symseq"
    name: "next_token"
