# Converts raw GSC audio data to Poisson spikes
# TODO incomplete, raw datasets not yet available

dataset:
  seed: 42
  alphabet:
    size: 10
    eos: "#"
  trial_length:
    min: 1
    max: 20
  splits:
    train: 100
    test: 100

symseq:
  generator:
    type: "ArtificialGrammar"
    mode: "random"
    params:
      label: "Constrained Random Grammar"
      ambiguities: 0
      ambiguity_depth: 0
      n_start_states: 1
      transition_density: 0.25
      assume_equiprobable: true
  tasks:
    - {name: "next_token", type: "NStepPrediction", params: {n: 1}}

seqbench:
  mode: "file"
  prob_generator_type: "restricted"
  time_grid:
    dt: 0.001  # seconds per final output row
  storage:
    path: "data/SeqBench"
    force_rebuild: false
  composition:
    combine_sequences: true
    sample_length: 20
  input_mapping:
    base: "gsc"
    base_params:
      bin_size: 10
      base_dataset_path: "datasets/GSC"
      split: "training"
      return_raw: true
    transforms:
      - name: MFCC
        sample_rate: 16000  # Hz
        n_mfcc: 13
        n_mels: 40
        n_fft: 512
        win_length: 400     # audio samples
        hop_length: 160     # audio samples -> 0.01s at 16 kHz
      - name: AdaptivePercentileNorm
        floor_percentile: 10.0
        ceil_percentile: 90.0
      - name: PowerLaw
        gamma: 5.0
      - name: ExpandDim
        axis: 1
        target_size: 700
      - name: RateCoding
        max_rate: 100.0
        normalize: true
      - name: PoissonEncoding
        temporal: true
        spike_dt: 0.001     # seconds per spike-bin row
      - name: BinAlongAxis
        bin_size: 5
        bin_axis: -1
        reduction: "binary"
  task:
    source: "symseq"
    name: "next_token"
