[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqbench"
version = "0.1.0"
description = "Python library for transforming, embedding, and benchmarking sequence representations."
readme = "README.md"
authors = [
    {name = "Younes Bouhadjar", email = "y.bouhadjar@fz-juelich.de"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "more-itertools",
    "torch",
    "pandas",
    "torchaudio",
    "tqdm",
    "matplotlib",
    "wandb",
    "h5py"
    #"symseq", #TODO: add symseq back when it is ready
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
"Homepage" = "https://github.com/symseqbench/SeqBench"
"Bug Tracker" = "https://github.com/symseqbench/SeqBench/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
